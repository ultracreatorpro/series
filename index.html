<!DOCTYPE html>

    <style>
        /* Reset de estilos por defecto */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            overflow-x: hidden;
        }

        /* Cabecera roja */
        header {
            width: 100%;
            background-color: red;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        /* Contenedor principal con margen superior para la cabecera */
        .main-container {
            padding-top: 70px; /* Altura de la cabecera */
        }

        /* Área del reproductor de video */
        #video-player-container {
            display: none; /* Oculto inicialmente */
            padding: 10px;
            background-color: #fff;
            border-bottom: 2px solid #ccc;
        }

        #video-player {
            width: 100%;
            height: auto;
        }

        /* Contenedores para los botones de episodios */
        .episode-buttons {
            display: flex;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .episode-button {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            flex: 1 1 45%;
            cursor: pointer;
            text-align: center;
        }

        .episode-button:hover {
            background-color: #0056b3;
        }

        /* Carrusel automático de portadas horizontales */
        .carousel-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            margin: 20px 0;
        }

        .carousel-track {
            display: flex;
            width: calc(100% * 10); /* Duplicar para loop */
            animation: scrollCarousel 20s linear infinite;
        }

        .carousel-item {
            min-width: 430px;
            height: 230px;
            margin-right: 10px;
            background-color: #ddd;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            flex-shrink: 0;
        }

        @keyframes scrollCarousel {
            0% { transform: translateX(0); }
            50% { transform: translateX(-2150px); } /* 430px * 5 */
            100% { transform: translateX(0); }
        }

        /* Menú de portadas verticales */
        .menu-container {
            font-weight: bold;
            padding: 12px;
        }

        .menu-title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .menu-scroll {
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .menu-item {
            flex: 0 0 auto;
            width: 110px;
            margin-right: 10px;
            text-align: center;
        }

        .menu-item img {
            width: 110px;
            height: 170px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
        }

        .menu-item p {
            font-size: 10px;
            margin-top: 5px;
            color: #333;
        }

        /* Estilos para el reproductor y botones cuando están activos */
        .active-player {
            animation: slideDown 0.5s forwards;
        }

        @keyframes slideDown {
            from { max-height: 0; opacity: 0; }
            to { max-height: 1000px; opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .carousel-item {
                min-width: 300px;
                height: 160px;
            }

            .menu-item {
                width: 80px;
            }

            .menu-item img {
                width: 80px;
                height: 130px;
            }

            header {
                font-size: 20px;
            }

            .menu-title {
                font-size: 15px;
                font-weight: bold;
            }

        /* Estilo del banner */
        .banner {
            margin: 0; /* Elimina cualquier margen adicional */
            width: 95%;
            height: 130px;
            margin: 10px 0;
            background-color: #f0f0f0;
            cursor: pointer;
        }

        .banner img {
            margin-left: 10px;
            border-radius: 10px;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

        // Función para mostrar el reproductor de video con la serie seleccionada
        function showVideoPlayer(seriesName) {
            const series = seriesData[seriesName];
            if (series) {
                videoPlayer.src = series.episodes[0].src; // Reproducir el primer episodio
                videoPlayerContainer.style.display = 'block';
                
                // Limpiar botones anteriores
                episodeButtonsContainer.innerHTML = '';

                // Crear botones para los episodios
                series.episodes.forEach((episode, index) => {
                    const button = document.createElement('button');
                    button.classList.add('episode-button');
                    button.textContent = episode.title;
                    button.addEventListener('click', () => {
                        videoPlayer.src = episode.src;
                        videoPlayer.play();
                    });
                    episodeButtonsContainer.appendChild(button);
                });

                // Opcional: Añadir animación
                videoPlayerContainer.classList.add('active-player');
            }
        }

        // Añadir eventos a los elementos del menú
